# ============================================================
# elements.conf — PROFIL DEV
# Chaîne : elementsregtest (signataire unique trivial, blocs à la
# demande). Monté en lecture seule dans le conteneur par
# docker-compose (/etc/elements/elements.conf).
#
# AUCUN identifiant ici : les credentials RPC sont injectés au
# démarrage via les variables d'environnement du fichier .env
# (options -rpcuser / -rpcpassword passées par docker-compose).
# Hors Docker, préférer l'authentification par cookie (fichier
# .cookie du datadir) ou une ligne rpcauth= (hash salé).
#
# ATTENTION : les paramètres marqués [GENESIS] participent au
# calcul du bloc de genèse. Les modifier rend le datadir existant
# invalide : faire `make reset` (destructif) après changement.
# ============================================================

chain=elementsregtest

# Les options réseau doivent figurer dans la section portant le nom
# de la chaîne (convention Bitcoin/Elements Core).
[elementsregtest]

# ---------------- RPC ----------------
rpcport=18884
rpcbind=0.0.0.0
# Le port n'est publié par docker-compose que sur 127.0.0.1 côté hôte ;
# le réseau compose est isolé. Restreindre davantage si besoin.
rpcallowip=0.0.0.0/0

# ---------------- Indexation (requis par electrs/esplora) ----------------
txindex=1

# ---------------- Transactions confidentielles ----------------
# Les adresses générées par le wallet sont blindées (CT) par défaut.
blindedaddresses=1

# ---------------- Chaîne autonome ----------------
# Pas de validation de peg-in Bitcoin : aucune dépendance à un bitcoind.
validatepegin=0

# [GENESIS] 21 000 000 (en satoshis) d'actif de base disponibles dès le
# bloc de genèse — pattern standard de développement Elements : évite
# d'attendre une maturité de coinbase pour financer les tests.
initialfreecoins=2100000000000000

# Le wallet considère les sorties « anyone-can-spend » (dont les coins
# de genèse ci-dessus) comme siennes : financement immédiat en dev.
anyonecanspendaremine=1

# ---------------- Frais ----------------
# Chaîne à blocs à la demande : aucune estimation de frais possible,
# un taux de repli est obligatoire pour sendtoaddress/issueasset.
fallbackfee=0.00001

# ---------------- Réseau P2P ----------------
# Nœud unique en dev : pas d'écoute P2P.
listen=0

# ---------------- Journalisation ----------------
# debug=rpc

# ============================================================
# Section miroir : utilisée seulement si ELEMENTS_DEV_CHAIN est
# basculé sur `liquidregtest` (chaîne custom aux paramètres par
# défaut identiques ; exigée par certains outils tiers). Les deux
# sections doivent rester alignées.
# ============================================================
[liquidregtest]
rpcport=18884
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
txindex=1
blindedaddresses=1
validatepegin=0
initialfreecoins=2100000000000000
anyonecanspendaremine=1
fallbackfee=0.00001
listen=0
