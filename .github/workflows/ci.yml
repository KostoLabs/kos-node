# ============================================================
# kos-node — CI/CD
#
# Triggers: push to dev, PR to dev
#   smoke-test  : build the elementsd image, boot the dev profile,
#                 create wallet, mine 101 blocks, run inline smoke test.
#   build-push  : (push to dev only) build & push elementsd and
#                 electrs images to GHCR (ghcr.io/kostolabs/*).
# ============================================================
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up .env from example
        run: cp .env.example .env

      - name: Build elementsd image and start dev profile
        run: docker compose --profile dev up -d --build

      - name: Wait for elementsd to be healthy
        run: |
          timeout 120 bash -c \
            'until docker inspect --format={{.State.Health.Status}} arion-elementsd-dev | grep -q healthy; do sleep 2; done'

      - name: Setup wallet, mine blocks, smoke test
        run: |
          source .env
          RPC="elements-cli -chain=elementsregtest -rpcport=18884 -rpcuser=$ELEMENTS_RPC_USER -rpcpassword=$ELEMENTS_RPC_PASSWORD"

          echo "=== 1. Create wallet ==="
          docker exec arion-elementsd-dev $RPC createwallet main 2>/dev/null || \
            docker exec arion-elementsd-dev $RPC loadwallet main 2>/dev/null || true

          echo "=== 2. Rescan to claim initialfreecoins (anyonecanspendaremine=1) ==="
          docker exec arion-elementsd-dev $RPC -rpcwallet=main rescanblockchain 2>/dev/null || true

          echo "=== 3. Mine 101 blocks ==="
          ADDR=$(docker exec arion-elementsd-dev $RPC -rpcwallet=main getnewaddress)
          docker exec arion-elementsd-dev $RPC -rpcwallet=main generatetoaddress 101 "$ADDR"
          echo "Block height: $(docker exec arion-elementsd-dev $RPC getblockcount)"

          echo "=== 4. Check balance ==="
          BAL=$(docker exec arion-elementsd-dev $RPC -rpcwallet=main getbalance)
          echo "Balance: $BAL"

          echo "=== 5. Issue test asset ==="
          RESULT=$(docker exec arion-elementsd-dev $RPC -rpcwallet=main issueasset 1000 1)
          echo "issueasset: $RESULT"

          echo "=== 6. Send asset to new address ==="
          ADDR2=$(docker exec arion-elementsd-dev $RPC -rpcwallet=main getnewaddress)
          docker exec arion-elementsd-dev $RPC -rpcwallet=main sendtoaddress "$ADDR2" 25
          docker exec arion-elementsd-dev $RPC -rpcwallet=main generatetoaddress 1 \
            $(docker exec arion-elementsd-dev $RPC -rpcwallet=main getnewaddress)

          echo "=== Smoke test PASSED ==="

      - name: Tear down
        if: always()
        run: docker compose --profile dev down -v

  build-push:
    if: github.event_name == 'push'
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & push elementsd (versioned + dev-latest)
        run: |
          docker build \
            --build-arg ELEMENTS_VERSION=23.3.3 \
            -t ghcr.io/kostolabs/elementsd:23.3.3 \
            -t ghcr.io/kostolabs/elementsd:dev-latest \
            docker/elements
          docker push ghcr.io/kostolabs/elementsd:23.3.3
          docker push ghcr.io/kostolabs/elementsd:dev-latest

      - name: Build & push electrs (sovereign image, if Dockerfile present)
        run: |
          if [ -s docker/electrs/Dockerfile ]; then
            docker build \
              -t ghcr.io/kostolabs/electrs-kosto:dev-latest \
              docker/electrs
            docker push ghcr.io/kostolabs/electrs-kosto:dev-latest
          else
            echo "docker/electrs/Dockerfile absent ou vide — image electrs non construite."
          fi